plugins { id 'com.android.application' }

def localSigningPropertiesFile = rootProject.file('local-signing.properties')
if (!localSigningPropertiesFile.exists()) {
    throw new GradleException('Missing local-signing.properties; refusing to use another signing key.')
}
def localSigningProperties = new java.util.Properties()
localSigningPropertiesFile.withInputStream { localSigningProperties.load(it) }

android {
    namespace 'ua.borlock.autotap'
    compileSdk 35

    signingConfigs {
        persistent {
            storeFile rootProject.file(localSigningProperties.getProperty('storeFile'))
            storePassword localSigningProperties.getProperty('storePassword')
            keyAlias localSigningProperties.getProperty('keyAlias')
            keyPassword localSigningProperties.getProperty('keyPassword')
            storeType localSigningProperties.getProperty('storeType', 'JKS')
        }
    }

    defaultConfig {
        applicationId 'ua.borlock.autotap'
        minSdk 24
        targetSdk 35
        versionCode 79
        versionName '1.9.48'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.persistent
            applicationIdSuffix '.newkey'
            resValue 'string', 'app_name', 'PackMate (test)'
        }
        release {
            signingConfig signingConfigs.persistent
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
